[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent-concierge-google-calendar-mcp"
version = "0.1.0"
description = "Read-only Google Calendar MCP server for Local Agent Concierge"
requires-python = ">=3.12"
dependencies = [
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "mcp>=2",
]

[project.optional-dependencies]
test = [
    "pytest>=9,<10",
    "anyio>=4,<5",
    "pytest-cov>=7,<8",
    "hypothesis>=6,<7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
