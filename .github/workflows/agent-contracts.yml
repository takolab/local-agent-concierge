name: Agent Contracts tests

on:
  pull_request:
    branches:
      - master
    paths:
      - "packages/agent-contracts/**"
      - ".github/workflows/agent-contracts.yml"

  push:
    branches:
      - master
    paths:
      - "packages/agent-contracts/**"
      - ".github/workflows/agent-contracts.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install Agent Contracts domain package
        run: pip install -e "packages/agent-contracts[test]"

      - name: Run Agent Contracts domain tests
        run: python -m pytest packages/agent-contracts/tests
