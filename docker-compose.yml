services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped

    gpus: all

    environment:
      OLLAMA_CONTEXT_LENGTH: "${OLLAMA_CONTEXT_LENGTH:-65536}"

    ports:
      - "127.0.0.1:11434:11434"

    volumes:
      - ollama-data:/root/.ollama

    networks:
      - concierge-network

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  hermes-agent:
    build:
      context: ./apps/hermes-agent

    restart: unless-stopped

    command:
      - gateway
      - run

    depends_on:
      ollama:
        condition: service_healthy

      google-calendar-mcp:
        condition: service_healthy

      otel-collector:
        condition: service_started

    environment:
      HERMES_UID: "${HERMES_UID:-1000}"
      HERMES_GID: "${HERMES_GID:-1000}"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_KEY: "${HERMES_API_SERVER_KEY:?HERMES_API_SERVER_KEY must be set in .env}"

      # Auto-instrumentation is activated via PYTHONPATH, set as a build-time
      # ENV in apps/hermes-agent/Dockerfile — not via a `command:` wrapper.
      # Hermes' own gateway supervision (the s6-rc "gateway-<profile>"
      # service, restored on every container start by cont-init's
      # 02-reconcile-profiles) starts its gateway process independently of
      # whatever this service's `command:` says, so a command-line wrapper
      # here would only instrument the very first invocation and get
      # silently dropped on every supervised restart. The Dockerfile's
      # PYTHONPATH survives that because s6 re-injects the full container
      # environment into every process it supervises.
      OTEL_SERVICE_NAME: "hermes-agent"
      OTEL_TRACES_EXPORTER: "otlp_proto_http"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4318"
      OTEL_METRICS_EXPORTER: "none"
      OTEL_LOGS_EXPORTER: "none"

    volumes:
      - ./data/hermes:/opt/data

    networks:
      - concierge-network

  slack-gateway:
    build:
      context: ./apps/slack-gateway
      target: runtime

    restart: unless-stopped

    depends_on:
      hermes-agent:
        condition: service_started

    environment:
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN:?SLACK_BOT_TOKEN must be set in .env}"
      SLACK_APP_TOKEN: "${SLACK_APP_TOKEN:?SLACK_APP_TOKEN must be set in .env}"
      HERMES_API_BASE_URL: "http://hermes-agent:8642"
      HERMES_API_SERVER_KEY: "${HERMES_API_SERVER_KEY:?HERMES_API_SERVER_KEY must be set in .env}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"

    networks:
      - concierge-network

  slack-gateway-test:
    profiles:
      - test

    build:
      context: ./apps/slack-gateway
      target: test

  google-calendar-mcp:
    build:
      context: ./mcp/google-calendar
      target: runtime

    restart: unless-stopped

    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"

    volumes:
      - ./data/google-calendar:/data/google-calendar

    networks:
      - concierge-network

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import socket;
          socket.create_connection(
              ("127.0.0.1", 8000),
              timeout=2,
          ).close()
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  google-calendar-mcp-test:
    profiles:
      - test

    build:
      context: ./mcp/google-calendar
      target: test

  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    restart: unless-stopped

    environment:
      MLFLOW_EXPERIMENT_ID: "${MLFLOW_EXPERIMENT_ID:-0}"

    command:
      - --config=/etc/otelcol-contrib/config.yaml

    volumes:
      - ./infra/observability/otel-collector.yaml:/etc/otelcol-contrib/config.yaml:ro

    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:13133:13133"

    networks:
      - concierge-network

  phoenix:
    image: arizephoenix/phoenix:latest
    restart: unless-stopped

    environment:
      PHOENIX_WORKING_DIR: /mnt/data

    ports:
      - "127.0.0.1:6006:6006"

    volumes:
      - phoenix-data:/mnt/data

    networks:
      - concierge-network

    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
              "http://127.0.0.1:6006/healthz",
              timeout=2,
          ).read()
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

  mlflow:
    image: ghcr.io/mlflow/mlflow:latest
    restart: unless-stopped

    command:
      - mlflow
      - server
      - --host
      - "0.0.0.0"
      - --port
      - "5000"
      - --backend-store-uri
      - sqlite:////mlflow/mlflow.db
      - --artifacts-destination
      - /mlflow/artifacts
      - --allowed-hosts
      - "localhost:*,127.0.0.1:*,mlflow:5000"

    ports:
      - "127.0.0.1:5000:5000"

    volumes:
      - mlflow-data:/mlflow

    networks:
      - concierge-network

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen(
              "http://127.0.0.1:5000/health",
              timeout=2,
          ).read()
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s

volumes:
  ollama-data:
  phoenix-data:
  mlflow-data:

networks:
  concierge-network:
    driver: bridge