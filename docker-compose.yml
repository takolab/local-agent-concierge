services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped

    gpus: all

    environment:
      OLLAMA_CONTEXT_LENGTH: "${OLLAMA_CONTEXT_LENGTH:-65536}"

    ports:
      - "127.0.0.1:11434:11434"

    volumes:
      - ollama-data:/root/.ollama

    networks:
      - concierge-network

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  hermes-agent:
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped

    command:
      - gateway
      - run

    depends_on:
      ollama:
        condition: service_healthy

    environment:
      HERMES_UID: "${HERMES_UID:-1000}"
      HERMES_GID: "${HERMES_GID:-1000}"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_KEY: "${HERMES_API_SERVER_KEY:?HERMES_API_SERVER_KEY must be set in .env}"

    volumes:
      - ./data/hermes:/opt/data

    networks:
      - concierge-network

volumes:
  ollama-data:

networks:
  concierge-network:
    driver: bridge