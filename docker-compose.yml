services:
  ollama:
    image: ollama/ollama:latest
    restart: unless-stopped

    gpus: all

    environment:
      OLLAMA_CONTEXT_LENGTH: "${OLLAMA_CONTEXT_LENGTH:-65536}"

    ports:
      - "127.0.0.1:11434:11434"

    volumes:
      - ollama-data:/root/.ollama

    networks:
      - concierge-network

    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  hermes-agent:
    image: nousresearch/hermes-agent:latest
    restart: unless-stopped

    command:
      - gateway
      - run

    depends_on:
      ollama:
        condition: service_healthy

      google-calendar-mcp:
        condition: service_healthy

    environment:
      HERMES_UID: "${HERMES_UID:-1000}"
      HERMES_GID: "${HERMES_GID:-1000}"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: "0.0.0.0"
      API_SERVER_KEY: "${HERMES_API_SERVER_KEY:?HERMES_API_SERVER_KEY must be set in .env}"

    volumes:
      - ./data/hermes:/opt/data

    networks:
      - concierge-network

  slack-gateway:
    build:
      context: ./apps/slack-gateway

    restart: unless-stopped

    depends_on:
      hermes-agent:
        condition: service_started

    environment:
      SLACK_BOT_TOKEN: "${SLACK_BOT_TOKEN:?SLACK_BOT_TOKEN must be set in .env}"
      SLACK_APP_TOKEN: "${SLACK_APP_TOKEN:?SLACK_APP_TOKEN must be set in .env}"
      HERMES_API_BASE_URL: "http://hermes-agent:8642"
      HERMES_API_SERVER_KEY: "${HERMES_API_SERVER_KEY:?HERMES_API_SERVER_KEY must be set in .env}"

    networks:
      - concierge-network

  google-calendar-mcp:
    build:
      context: ./mcp/google-calendar
      target: runtime

    restart: unless-stopped

    volumes:
      - ./data/google-calendar:/data/google-calendar

    networks:
      - concierge-network

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import socket;
          socket.create_connection(
              ("127.0.0.1", 8000),
              timeout=2,
          ).close()
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  google-calendar-mcp-test:
    profiles:
      - test

    build:
      context: ./mcp/google-calendar
      target: test

volumes:
  ollama-data:

networks:
  concierge-network:
    driver: bridge