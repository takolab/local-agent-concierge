[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-agent-concierge-orchestrator"
version = "0.1.0"
description = "Minimal in-process Agent routing skeleton for Local Agent Concierge"
requires-python = ">=3.12"
dependencies = [
    "local-agent-concierge-agent-contracts",
]

[project.optional-dependencies]
test = [
    "pytest>=9,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.setuptools.packages.find]
where = ["src"]
